# Rebuild lib/ on Dependabot PRs, then commit and push with a PAT so CI retriggers.
# GITHUB_TOKEN pushes are ignored by Actions; create a repo secret ADD_AND_COMMIT_PAT
# (contents: write). pull_request_target is used so that secret is available.
name: Rebuild lib
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild and commit lib
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.ADD_AND_COMMIT_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: EndBug/add-and-commit@645ecc0dd0a57f4d86d26c0aa5fc42c0a856fbca # v11.0.0
        with:
          add: lib
          default_author: github_actions
          fetch: false
          message: 'chore: rebuild lib'
          push: true
